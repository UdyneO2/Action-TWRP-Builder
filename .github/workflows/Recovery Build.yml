name: Recovery Builder

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'Recovery Manifest URL'
        required: true
        default: 'https://github.com/PitchBlackRecoveryProject/manifest_pb'
      MANIFEST_BRANCH:
        description: 'Manifest Branch'
        required: true
        default: 'android-12.1'
      DEVICE_TREE_URL:
        description: 'Device Tree URL'
        required: true
        default: 'https://github.com/udyneos-prjkt/twrp_tree_mt6768'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'pbrp'
      DEVICE_PATH:
        description: 'Device Path in source'
        required: true
        default: 'device/xiaomi/lancelot'
      DEVICE_NAME:
        description: 'Device Codename'
        required: true
        default: 'lancelot'
      BTARGET:
        description: 'Device target'
        required: true
        default: 'pb_lancelot'
      MAKE_TARGET:
        description: 'Make target'
        required: true
        default: 'recoveryimage'
      DEVICE_MODEL:
        description: 'Device Model Name'
        required: true
        default: 'Redmi 9'

env:
  BUILD_START_TIME: ''

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Start build timer
      run: |
        echo "BUILD_START_TIME=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV
        echo "BUILD_TIMESTAMP=$(date +%s)" >> $GITHUB_ENV

    - name: Checkout scripts
      uses: actions/checkout@v4
      with:
        path: scripts
   # Cleanup The Actions Workspace Using Custom Composite Run Actions
    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main
      # That's it! Now use your normal steps

    - name: Prepare the environment
      run: |
        sudo apt update && sudo apt upgrade -y
        DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            linux-modules-extra-$(uname -r) \
            gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
            libc6-dev lib32ncurses-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils \
            xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev \
            build-essential libgtk-3-dev libglu1-mesa-dev freeglut3-dev git libxml2 lzop pngcrush schedtool squashfs-tools \
            imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses6 python3 tar ccache

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
        cache: 'gradle'
        
    - name: Setup ccache
      run: |
        CCACHE_DIR=/tmp/ccache
        ccache -M 20G
        ccache -o compression=true
        ccache -z

    - name: Setup repo tool
      run: |
        sudo curl -sLo /usr/local/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
        sudo chmod a+x /usr/local/bin/repo

    - name: Initialize workspace
      run: |
        mkdir -p twrp-build
        cd twrp-build
        repo init \
          --depth=1 \
          -u ${{ github.event.inputs.MANIFEST_URL }} \
          -b ${{ github.event.inputs.MANIFEST_BRANCH }} \
          --groups=all,-notdefault

    - name: Sync source
      run: |
        cd twrp-build
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle

    - name: Clone device tree
      run: |
        cd twrp-build
        rm -rf ${{ github.event.inputs.DEVICE_PATH }}
        git clone \
          --depth=1 \
          --branch ${{ github.event.inputs.DEVICE_TREE_BRANCH }} \
          ${{ github.event.inputs.DEVICE_TREE_URL }} \
          ${{ github.event.inputs.DEVICE_PATH }}

    - name: Build TWRP
      run: |
        cd twrp-build
        export USE_CCACHE=1
        export CCACHE_EXEC=$(which ccache)
        export CCACHE_DIR=/tmp/ccache
        
        source build/envsetup.sh
        lunch ${{ github.event.inputs.BTARGET }}-eng
        make clean
        make ${{ github.event.inputs.MAKE_TARGET }} -j$(nproc --all)

        ccache -s

    - name: Get build information
      id: build_info
      run: |
        BUILD_END_TIME=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
        BUILD_END_TIMESTAMP=$(date +%s)
        BUILD_DURATION=$((BUILD_END_TIMESTAMP - ${{ env.BUILD_TIMESTAMP }}))
        
        # Format duration
        if [ $BUILD_DURATION -lt 60 ]; then
          DURATION_STR="${BUILD_DURATION} seconds"
        elif [ $BUILD_DURATION -lt 3600 ]; then
          minutes=$((BUILD_DURATION / 60))
          seconds=$((BUILD_DURATION % 60))
          DURATION_STR="${minutes}m ${seconds}s"
        else
          hours=$((BUILD_DURATION / 3600))
          minutes=$(( (BUILD_DURATION % 3600) / 60 ))
          seconds=$((BUILD_DURATION % 60))
          DURATION_STR="${hours}h ${minutes}m ${seconds}s"
        fi
        
        echo "BUILD_END_TIME=${BUILD_END_TIME}" >> $GITHUB_ENV
        echo "BUILD_DURATION=${DURATION_STR}" >> $GITHUB_ENV
        
        # Get file info
        RECOVERY_FILE="twrp-build/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery.img"
        if [ -f "$RECOVERY_FILE" ]; then
          FILE_SIZE=$(ls -lh "$RECOVERY_FILE" | awk '{print $5}')
          echo "FILE_SIZE=${FILE_SIZE}" >> $GITHUB_ENV
        else
          echo "FILE_SIZE=Not found" >> $GITHUB_ENV
        fi

    - name: Upload recovery image
      uses: actions/upload-artifact@v4
      with:
        name: twrp-${{ github.event.inputs.DEVICE_NAME }}
        path: twrp-build/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery.img

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: twrp-build/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery.img
        name: TWRP ${{ github.event.inputs.DEVICE_MODEL }}
        tag_name: twrp-${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_number }}
        body: |
          # 📱 TWRP Recovery for ${{ github.event.inputs.DEVICE_MODEL }}
          
          ## 📋 Device Information
          **Device Codename:** `${{ github.event.inputs.DEVICE_NAME }}`  
          **Device Model:** ${{ github.event.inputs.DEVICE_MODEL }}  
          **File Size:** ${{ env.FILE_SIZE }}  
          
          ## 🛠️ Build Information
          **Build ID:** `${{ github.run_number }}`  
          **Build Started:** ${{ env.BUILD_START_TIME }}  
          **Build Finished:** ${{ env.BUILD_END_TIME }}  
          **Build Duration:** ${{ env.BUILD_DURATION }}  
          
          **TWRP Manifest:** `${{ github.event.inputs.MANIFEST_BRANCH }}`  
          **Device Tree:** [${{ github.event.inputs.DEVICE_TREE_BRANCH }}](${{ github.event.inputs.DEVICE_TREE_URL }})  
          **Build Target:** `${{ github.event.inputs.MAKE_TARGET }}`  
          
          ## 📥 Installation
          1. Boot your device to fastboot mode
          2. Flash using:  
             ```bash
             fastboot flash recovery recovery.img
             ```
          3. Reboot to recovery:  
             ```bash
             fastboot reboot recovery
             ```
          
          ## ⚠️ Important Notes
          - Always backup your data before flashing
          - This is an unofficial/community build
          - Use at your own risk
          
          ---
          *Built automatically via GitHub Actions • [View Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
